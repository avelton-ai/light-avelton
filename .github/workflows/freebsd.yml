name: FreeBSD
'on':
  workflow_dispatch: {}
concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  freebsd:
    name: FreeBSD 14 (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: storytold/craft-fonts
        ref: 8dcdacd5153e64560d109541a47d806f26f048c0
        path: craft-fonts
    - name: Build and test in a FreeBSD VM
      uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
      with:
        release: '14.3'
        usesh: true
        cpu: 4
        mem: 12288
        copyback: false
        prepare: |
          pkg install -y git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
        run: |
          . "$HOME/.cargo/env"
          # The checkout is synced in under another owner; let tests that call git read it.
          git config --global --add safe.directory "*"
          rustc --version
          export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --workspace --all-targets --locked
          CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked
